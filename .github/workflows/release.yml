name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo build --release --workspace --all-features
      - name: Package Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item target\release\assistant-cli.exe package\
          Copy-Item target\release\assistant-daemon.exe package\
          Copy-Item config\assistant.example.toml package\
          Copy-Item README.md,LICENSE,CHANGELOG.md package\
          Compress-Archive package\* "voice-assistant-core-$env:GITHUB_REF_NAME-windows-x64.zip"
      - name: Publish GitHub release
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes "voice-assistant-core-$env:GITHUB_REF_NAME-windows-x64.zip"
        env:
          GH_TOKEN: ${{ github.token }}
