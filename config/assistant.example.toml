schema_version = 6

[audio]
# Non-empty backend device ID, or "default" for the system input device.
device_id = "default"
target_sample_rate = 16000
channels = 1
frame_ms = 20
pre_roll_ms = 900
queue_capacity_frames = 250
vad_threshold = 0.015
command_min_ms = 300
command_max_ms = 10000
trailing_silence_ms = 700
reconnect_delay_ms = 1000
stall_timeout_ms = 3000

[matching]
normalize_yo = true

[wake_word]
model = "alphacep/vosk-model-streaming-ru"
keyword = "ассистент"
aliases = ["помощник"]
score = 1.5
threshold = 0.35
cooldown_ms = 1200

[inference]
model = "alphacep/vosk-model-streaming-ru"
# 0 selects the available host parallelism automatically.
threads = 0
queue_capacity = 2
timeout_ms = 30000
max_restarts = 3
restart_backoff_ms = 500

[policy]
# Set to false to execute every command, including high-risk commands,
# without confirmation.
confirmations_enabled = true
confirmation_timeout_ms = 15000
voice_confirmations_enabled = true
confirmation_accept_phrases = ["да", "подтверждаю"]
confirmation_cancel_phrases = ["нет", "отмена"]
handler_rate_limit_ms = 500
handler_failure_threshold = 3
handler_circuit_breaker_ms = 30000

[ipc]
pipe_name = "voice-assistant-core"
io_timeout_ms = 30000

[[commands]]
id = "open_notepad"
enabled = true
phrases = ["открой блокнот", "запусти блокнот"]
handler = "launch_app"
risk = "low"
requires_confirmation = false
timeout_ms = 10000

[commands.parameters]
executable = "notepad.exe"

[[commands]]
id = "set_volume_voice"
enabled = true
phrases = ["установи громкость {level}"]
handler = "set_volume"
risk = "low"
requires_confirmation = false
timeout_ms = 10000

[commands.slots.level]
type = "integer"
min = 0
max = 100

[commands.parameters]
level = "{level}"

# Disabled example of an ordered command. delay_ms is applied before its action.
# click_mouse always requires risk = "high" and moves the cursor smoothly.
[[commands]]
id = "browser_demo"
enabled = false
phrases = ["открой пример сайта"]
risk = "high"
requires_confirmation = true
timeout_ms = 15000

[[commands.actions]]
handler = "open_url"

[commands.actions.parameters]
url = "https://example.com"

[[commands.actions]]
handler = "set_volume"
delay_ms = 500

[commands.actions.parameters]
level = "35"

[[commands.actions]]
handler = "click_mouse"
delay_ms = 1000

[commands.actions.parameters]
x = "800"
y = "450"
duration_ms = "500"
