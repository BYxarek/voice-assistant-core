[package]
name = "assistant-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["model-source-huggingface"]
model-source-huggingface = ["dep:hf-hub", "dep:sha2"]
stt-sherpa-onnx = ["dep:sentencepiece-rs", "dep:sherpa-onnx"]

[dependencies]
async-trait.workspace = true
cpal.workspace = true
hound.workspace = true
hf-hub = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sentencepiece-rs = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sherpa-onnx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
